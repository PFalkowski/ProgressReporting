name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write

jobs:
  publish:
    name: Pack & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore & build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack ProgressReporting/ProgressReporting.csproj --configuration Release --no-build -p:PackageVersion=${{ github.ref_name }}

      - name: Login to NuGet (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push ProgressReporting/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
